name: E2E & Regression Tests

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

env:
  SANDBOX_URL: "https://sandbox.fluxnova-control-center.com"
  SHARD_TOTAL: 2

jobs:
  e2e-shard:
    name: E2E Tests (Shard ${{ matrix.shard }}/${{ strategy.job-total }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up pnpm and install dependencies
        uses: ./.github/actions/pnpm-setup

      - name: Generate Fluxnova API client
        uses: ./.github/actions/generate-client

      - name: Run E2E shard ${{ matrix.shard }}/${{ env.SHARD_TOTAL }}
        uses: ./.github/actions/run-e2e
        with:
          sandbox-url: ${{ env.SANDBOX_URL }}
          shard-index: ${{ matrix.shard }}
          shard-total: ${{ env.SHARD_TOTAL }}

  e2e-report:
    name: Merge E2E Reports
    runs-on: ubuntu-latest
    needs: e2e-shard
    if: always()
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up pnpm and install dependencies
        uses: ./.github/actions/pnpm-setup

      - name: Download all E2E shard blob reports
        uses: actions/download-artifact@v4
        with:
          pattern: e2e-blob-shard-*
          path: all-blob-reports/
          merge-multiple: true

      - name: Merge reports - JUnit
        run: npx playwright merge-reports --reporter junit all-blob-reports/

      - name: Merge reports - HTML
        run: npx playwright merge-reports --reporter html all-blob-reports/

      - name: Upload merged E2E HTML report
        uses: actions/upload-artifact@v4
        with:
          name: playwright-e2e-report-${{ github.run_id }}
          path: playwright-report/
          retention-days: 14

  regression-shard:
    name: Regression Tests (Shard ${{ matrix.shard }}/${{ strategy.job-total }})
    runs-on: ubuntu-latest
    needs: e2e-report
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up pnpm and install dependencies
        uses: ./.github/actions/pnpm-setup

      - name: Generate Fluxnova API client
        uses: ./.github/actions/generate-client

      - name: Run Regression shard ${{ matrix.shard }}/${{ env.SHARD_TOTAL }}
        uses: ./.github/actions/run-regression
        with:
          sandbox-url: ${{ env.SANDBOX_URL }}
          shard-index: ${{ matrix.shard }}
          shard-total: ${{ env.SHARD_TOTAL }}

  regression-report:
    name: Merge Regression Reports
    runs-on: ubuntu-latest
    needs: regression-shard
    if: always()
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up pnpm and install dependencies
        uses: ./.github/actions/pnpm-setup

      - name: Download all Regression shard blob reports
        uses: actions/download-artifact@v4
        with:
          pattern: regression-blob-shard-*
          path: all-blob-reports/
          merge-multiple: true

      - name: Merge reports - JUnit
        run: npx playwright merge-reports --reporter junit all-blob-reports/

      - name: Merge reports - HTML
        run: npx playwright merge-reports --reporter html all-blob-reports/

      - name: Upload merged Regression HTML report
        uses: actions/upload-artifact@v4
        with:
          name: playwright-regression-report-${{ github.run_id }}
          path: playwright-report/
          retention-days: 14
