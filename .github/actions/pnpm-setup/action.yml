name: 'pnpm Setup'
description: 'Sets up Node.js and pnpm with caching'

runs:
  using: 'composite'
  steps:
    - name: Set up Node.js and pnpm
      uses: pnpm/setup@v1
      with:
        runtime: node@24
        install: false
        cache: true

    - name: Install dependencies
      shell: bash
      run: pnpm install --frozen-lockfile

    - name: Show versions
      shell: bash
      run: |
        node --version
        pnpm --version
