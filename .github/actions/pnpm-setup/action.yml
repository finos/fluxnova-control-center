name: 'pnpm Setup'
description: 'Installs pnpm and project dependencies using the Node.js version from package.json'

runs:
  using: 'composite'
  steps:
    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version-file: package.json

    - name: Install pnpm
      shell: bash
      run: |
        npm install --global --prefix "$RUNNER_TEMP/pnpm" --no-audit --no-fund "$(node -p "require('./package.json').packageManager")"
        echo "$RUNNER_TEMP/pnpm/bin" >> "$GITHUB_PATH"

    - name: Install dependencies
      shell: bash
      run: pnpm install --frozen-lockfile

    - name: Show versions
      shell: bash
      run: |
        echo "Node Version: $(node --version)"
        echo "Pnpm Version: $(pnpm --version)"
