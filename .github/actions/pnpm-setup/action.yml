name: "pnpm Setup"
description: "Sets up Node.js and pnpm with caching"

runs:
  using: "composite"
  steps:
    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 22
        cache: pnpm
        cache-dependency-path: pnpm-lock.yaml

    - name: Set up pnpm
      uses: pnpm/action-setup@v4
      with:
        version: 11.1.2
        run_install: false

    - name: Install dependencies
      shell: bash
      run: pnpm install --frozen-lockfile

    - name: Show versions
      shell: bash
      run: |
        node --version
        pnpm --version

