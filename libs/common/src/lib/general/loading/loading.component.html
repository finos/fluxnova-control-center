<div [ngClass]="{ 'loading-background': blockInteraction }">
  <div class="app-loading" role="alert" aria-label="Loading..." aria-busy="true" aria-live="polite">
    <div class="logo"></div>
    <svg class="spinner" viewBox="25 25 50 50">
      <circle
        class="path"
        cx="50"
        cy="50"
        r="20"
        fill="none"
        stroke-width="2"
        stroke-miterlimit="10"
        aria-hidden="true"
      />
    </svg>
  </div>
</div>
