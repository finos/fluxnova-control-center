<div #diagramLegend id="diagram-legend" [ngStyle]="legendStyle">
  <button
    type="button"
    class="btn shadow-none close-button d-flex align-items-center"
    aria-label="Close"
    (click)="close($event, true)"
  >
    <fluxnova-icon class="font-standard" iconName="close"></fluxnova-icon>
  </button>
  <div>
    <h5>Color Legend:</h5>
    <ul class="list-unstyled">
      @for (color of colorData; track color) {
        <li>
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none">
            <circle
              cx="12"
              cy="12"
              r="10.5"
              [attr.fill]="color.fillColor"
              [attr.stroke]="color.strokeColor"
              stroke-width="3"
            />
          </svg>
          {{ color.label }}
        </li>
      }
    </ul>
