<div class="card m-2 widget-body">
  <div class="card-header graph-header">
    <div style="width: fit-content; padding-top: 7px" [innerHtml]="widgetTitle"></div>
    <div style="width: 200px">
      <ng-select
        bindValue="value"
        [(ngModel)]="timeFrameSelected"
        [dropdownPosition]="'bottom'"
        [items]="timeFrameOptions"
        appendTo="body"
        (change)="onTimeFrameSelected()"
        [searchable]="false"
        [clearable]="false"
      >
      </ng-select>
    </div>
  </div>
  <div class="card-body" style="display: flex; align-items: center; justify-content: center; min-height: 440px">
    @if (dataLoading) {
      <fluxnova-loading></fluxnova-loading>
    }
    @if (chartData.labels && !dataLoading) {
      <div class="chart-wrapper">
        <span class="chart-subtitle">{{ subtitle }}</span>
        <span *ngIf="drilldown" class="drillup">
          <button class="drillup-button" (click)="onDrillup()" aria-label="Return to main view">Main</button
          >&emsp;/&emsp;<b>{{ selectedDefinitionKey }}</b>
        </span>
        <div class="chart-plot">
          <canvas
            baseChart
            #chart="base-chart"
            class="chart-canvas"
            [type]="'doughnut'"
            [data]="chartData"
            [options]="chartOptions"
            [legend]="false"
            (chartClick)="onChartClick($event)"
            (chartHover)="onChartHover($event, chart)"
          ></canvas>
          <div class="chart-center-label">
            <a [href]="linkHref" target="_blank" rel="noopener noreferrer" class="center-link">
              <span class="center-count"
                ><b>{{ displayCount }}</b></span
              >
            </a>
          </div>
        </div>
        <div class="chart-legend" aria-label="Chart legend">
          <span class="chart-legend-title">{{ legendTitle }}</span>
          @for (label of labelsDef; track label; let index = $index) {
            <button
              type="button"
              class="legend-item"
              [class.is-hidden]="!visibilityDef[index]"
              [attr.aria-pressed]="visibilityDef[index]"
              (click)="onLegendItemClick(index)"
            >
              <span class="legend-swatch" [style.backgroundColor]="getColor(index)"></span>
              <span class="legend-label">{{ label }}</span>
            </button>
          }
        </div>
      </div>
    }
  </div>
</div>
