<div class="items-list-view list-item-type-decision-definition">
  <div class="items-list-view-header global-header">
    <div class="header-label">Decision Definitions</div>
    <div class="toolbar bulk-actions">
      <span class="toolbar-actions toolbar-section-left bulk-span"></span>
      <div class="toolbar-actions toolbar-section-right">
        <fluxnova-toggle-filters
          class="d-flex align-items-center"
          (resetToggles)="resetColumns()"
          (selectToggle)="selectToggleFilter($event)"
          [toggleFilters]="toggleFilters"
          [isResetVisible]="hasFilterOrSortDeviatedFromDefault || hasListViewStateDeviatedFromDefault"
        >
        </fluxnova-toggle-filters>
      </div>
    </div>
  </div>

  <fluxnova-items-table
    #itemsTable
    [items]="data"
    [isLoading]="isLoading"
    [sorting]="sorting"
    [filters]="filters"
    [listViewState]="listViewState"
    [checkboxes]="false"
    (columnHeaderFilterChange)="selectFilter($event)"
    (columnHeaderSortChange)="selectHeaderSort($event)"
    (listViewStateChange)="columnPrefsUpdated($event)"
    rowSelectionType="singleRow"
    [rowClickSelection]="true"
  ></fluxnova-items-table>

  <fluxnova-ag-pagination
    class="border-top align-items-center px-3"
    [totalItems]="totalCount"
    [loading]="isLoading"
    (paginationChanged)="paginationSubject$.next({ page: $event.page, pageSize: $event.pageSize })"
  ></fluxnova-ag-pagination>
</div>
