<ag-grid-angular
  #agGrid
  *fluxnovaLoading="isLoading"
  loading="false"
  skipHeaderOnAutoSize="true"
  suppressColumnVirtualisation="true"
  suppressDragLeaveHidesColumns="true"
  suppressPaginationPanel="true"
  suppressCellFocus="true"
  animateRows="true"
  class="custom-ag-theme border-top items-table-ag-grid custom-ag-floating-filters"
  [rowData]="items"
  [columnDefs]="columnDefs"
  [rowHeight]="50"
  [headerHeight]="50"
  [floatingFiltersHeight]="40"
  [gridOptions]="gridOptions"
  [suppressMultiSort]="true"
  [components]="frameworkComponents"
  [overlayNoRowsTemplate]="overlayNoRowsTemplate"
  [suppressNoRowsOverlay]="isLoading"
  [defaultColDef]="defaultColDef"
  [context]="context"
  (selectionChanged)="onSelectionChanged($event)"
  (rowClicked)="onRowClicked($event)"
  (sortChanged)="onSortChanged()"
  (filterChanged)="onFilterChanged($event)"
  (columnHeaderMouseOver)="onColumnHeaderMouseOver()"
  (columnHeaderMouseLeave)="onColumnHeaderMouseLeave()"
  (dragStopped)="onColumnDragStopped()"
  (gridReady)="onGridReady($event)"
  (firstDataRendered)="onFirstDataRendered($event)"
  (cellClicked)="onCellClicked($event)"
>
</ag-grid-angular>
