<div class="diagram-canvas-wrapper">
  @if (isLoading || showSpinner) {
    <div style="position: relative; top: 50%; z-index: 1">
      <div class="app-loading">
        <div class="logo"></div>
        <svg class="spinner" viewBox="25 25 50 50">
          <circle class="path" cx="50" cy="50" fill="none" r="20" stroke-miterlimit="10" stroke-width="2" />
        </svg>
      </div>
    </div>
  }
  @if (!isLoading && !diagramFound) {
    <div class="no-diagram">
      <p>No Diagram Found</p>
    </div>
  }
  <div #diagramContainerDiv class="canvas" tabindex="0"></div>
</div>
