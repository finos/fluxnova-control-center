<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Fluxnova Login</title>
    <base href="/" />
  </head>
  <style>
    .app-loading {
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100%;
    }

    .app-loading .spinner {
      height: 200px;
      width: 200px;
      margin: 0;
      animation: rotate 2s linear infinite;
      transform-origin: center center;
      position: absolute;
      top: calc(50% - 100px);
      bottom: 0;
      left: calc(50% - 100px);
      right: 0;
    }

    .spinner .path {
      stroke-dasharray: 1, 200;
      stroke-dashoffset: 0;
      animation: dash 1.5s ease-in-out infinite;
      stroke-linecap: round;
      stroke: #ddd;
    }

    @keyframes rotate {
      100% {
        transform: rotate(360deg);
      }
    }

    @keyframes dash {
      0% {
        stroke-dasharray: 1, 200;
        stroke-dashoffset: 0;
      }
      50% {
        stroke-dasharray: 89, 200;
        stroke-dashoffset: -35px;
      }
      100% {
        stroke-dasharray: 89, 200;
        stroke-dashoffset: -124px;
      }
    }

    html,
    body {
      height: 99%;
    }
  </style>
  <body>
    <div class="app-loading">
      <div class="logo"></div>
      <svg class="spinner" viewBox="25 25 50 50">
        <circle class="path" cx="50" cy="50" r="20" fill="none" stroke-width="2" stroke-miterlimit="10" />
      </svg>
    </div>
  </body>
  <script>
    window.location.replace(`./?redirectTo=${encodeURIComponent(window.location.href)}`);
  </script>
</html>
